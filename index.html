<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Expense Tracker</title>
<meta name="theme-color" content="#6c5ce7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="application-name" content="Expenses">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f3f4f9;--card:#fff;--text:#14151f;--muted:#6b6f85;--line:#e6e8f1;--acc:#6c5ce7;--acc2:#a29bfe;--danger:#e5484d;--sh:0 6px 24px rgba(40,40,90,.08);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f17;--card:#181a26;--text:#f1f2f8;--muted:#8d91a8;--line:#262839;--acc:#8b7bff;--acc2:#5b4de0;--sh:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f17;--card:#181a26;--text:#f1f2f8;--muted:#8d91a8;--line:#262839;--acc:#8b7bff;--acc2:#5b4de0;--sh:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 14px}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.3px}
.ib{border:0;background:var(--card);color:var(--text);width:40px;height:40px;border-radius:50%;box-shadow:var(--sh);font-size:18px;cursor:pointer}
.hero{border-radius:26px;padding:24px 22px;color:#fff;background:linear-gradient(135deg,#6c5ce7 0%,#8e7bff 55%,#c26bff 100%);box-shadow:0 14px 34px rgba(108,92,231,.35);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero small{opacity:.85;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
.hero .big{font-size:42px;font-weight:800;letter-spacing:-1px;margin:6px 0 4px;word-break:break-all}
.hero .sub{opacity:.85;font-size:13px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:16px;background:rgba(255,255,255,.2)}
.bar i{display:block;height:100%}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:26px 4px 10px;font-weight:600}
.cat{background:var(--card);border-radius:20px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.cat>.row{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.cat .nm{flex:1;min-width:0}
.cat .nm b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .nm span{font-size:12px;color:var(--muted)}
.cat .amt{font-weight:700;font-size:16px}
.chev{color:var(--muted);transition:transform .2s;font-size:12px}
.open .chev{transform:rotate(90deg)}
.prog{height:4px;background:var(--line);margin:0 16px 14px;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px}
.tx{border-top:1px solid var(--line);padding:4px 16px 8px}
.t{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.t:last-of-type{border-bottom:0}
.t .d{flex:1;min-width:0}
.t .d b{font-weight:600;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .d span{font-size:12px;color:var(--muted)}
.t .a{font-weight:700;font-size:14px}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer}
.x.armed{background:var(--danger);color:#fff}
.empty{text-align:center;color:var(--muted);padding:12px 0;font-size:13px}
.link{border:0;background:none;color:var(--danger);font-size:13px;padding:8px 0;cursor:pointer}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;color:#fff;font-size:32px;background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 10px 26px rgba(108,92,231,.5);cursor:pointer;line-height:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:18px}
.amtin{width:100%;border:0;background:transparent;color:var(--text);font-size:44px;font-weight:800;text-align:center;outline:none;padding:6px 0;letter-spacing:-1px}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.in{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;font-family:inherit}
.in:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit}
.chip.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);font-weight:600}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--acc2),var(--acc));margin-top:20px;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--bg);color:var(--text);border:1.5px solid var(--line);margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}.sw.sel{border-color:var(--text)}
.note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Expense Tracker</h1><button class="ib" id="menuBtn" aria-label="Data and settings">⚙︎</button></div>
  <div class="hero">
    <small>Grand total</small>
    <div class="big" id="grand">0.00</div>
    <div class="sub" id="gsub"></div>
    <div class="bar" id="gbar"></div>
  </div>
  <h2>Categories</h2>
  <div id="cats"></div>
</div>
<button class="fab" id="fab" aria-label="Add expense">+</button>
<div class="ov" id="ov"></div>

<div class="sheet" id="addSheet">
  <div class="grab"></div>
  <h3>New expense</h3>
  <input class="amtin" id="fAmt" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
  <label>Category</label>
  <div class="chips" id="fCats"></div>
  <div id="newCatBox" style="display:none">
    <label>New category name</label>
    <input class="in" id="fNewCat" maxlength="24" placeholder="e.g. Pets">
  </div>
  <div class="two">
    <div><label>Date</label><input class="in" id="fDate" type="date"></div>
    <div><label>Note</label><input class="in" id="fNote" maxlength="60" placeholder="Optional"></div>
  </div>
  <button class="btn" id="saveBtn">Add expense</button>
</div>

<div class="sheet" id="dataSheet">
  <div class="grab"></div>
  <h3>Your data</h3>
  <p class="note" style="margin-top:0">Everything is saved on this device, in this browser. Download a backup now and then.</p>
  <label>Currency symbol</label>
  <input class="in" id="fCur" maxlength="4" placeholder="$">
  <button class="btn" id="csvBtn">Download spreadsheet (CSV)</button>
  <button class="btn sec" id="jsonBtn">Download backup (JSON)</button>
  <button class="btn sec" id="impBtn">Restore from backup</button>
  <input type="file" id="impFile" accept=".json,application/json" style="display:none">
  <p class="note" id="storeNote"></p>
</div>
<div class="sheet" id="editSheet">
  <div class="grab"></div>
  <h3>Edit category</h3>
  <label>Name</label>
  <input class="in" id="eName" maxlength="24">
  <label>Color</label>
  <div class="chips" id="eSw"></div>
  <label>Position in list</label>
  <div class="two">
    <button class="btn sec" id="eUp" style="margin-top:0">↑ Move up</button>
    <button class="btn sec" id="eDn" style="margin-top:0">↓ Move down</button>
  </div>
  <button class="btn" id="eSave">Save changes</button>
  <button class="btn sec" id="eDel" style="color:var(--danger)">Delete category</button>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
var KEY="expense-tracker-v1";
var COLORS=["#6c5ce7","#00b894","#fdcb6e","#e17055","#0984e3","#e84393","#00cec9","#fd79a8","#a29bfe","#55efc4","#ff7675","#74b9ff"];
var mem=null,canStore=true;
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){canStore=false;}
  return mem;
}
function save(){
  mem=JSON.parse(JSON.stringify(S));
  try{localStorage.setItem(KEY,JSON.stringify(S));canStore=true;}catch(e){canStore=false;}
}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
var S=load();
if(!S||!Array.isArray(S.cats)){
  S={cur:"$",cats:["Groceries","Rent","Transport","Dining Out","Utilities","Entertainment","Health","Shopping"].map(function(n,i){return{id:uid(),name:n,color:COLORS[i%COLORS.length]};}),tx:[]};
}
var open={},selCat=null,armed=null,newMode=false;
var $=function(id){return document.getElementById(id);};
function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function money(n){return S.cur+" "+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function fdate(s){var p=s.split("-");if(p.length!==3)return s;return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on");},2200);}

function render(){
  var tot={},cnt={},grand=0;
  S.cats.forEach(function(c){tot[c.id]=0;cnt[c.id]=0;});
  S.tx.forEach(function(t){if(tot[t.cat]!=null){tot[t.cat]+=t.amt;cnt[t.cat]++;}grand+=t.amt;});
  $("grand").textContent=money(grand);
  $("gsub").textContent=S.tx.length+" transaction"+(S.tx.length===1?"":"s")+" · "+S.cats.length+" categories";
  var gb=$("gbar");gb.textContent="";
  S.cats.forEach(function(c){if(tot[c.id]>0){var i=h("i");i.style.width=(tot[c.id]/grand*100)+"%";i.style.background="#fff";i.style.opacity=.35+.65*(tot[c.id]/grand);gb.appendChild(i);}});
  var box=$("cats");box.textContent="";
  S.cats.forEach(function(c){
    var card=h("div","cat"+(open[c.id]?" open":""));
    var row=h("div","row");
    var dot=h("span","dot");dot.style.background=c.color;
    var nm=h("div","nm");nm.appendChild(h("b","",c.name));nm.appendChild(h("span","",cnt[c.id]+" transaction"+(cnt[c.id]===1?"":"s")+(grand>0?" · "+Math.round(tot[c.id]/grand*100)+"%":"")));
    row.appendChild(dot);row.appendChild(nm);row.appendChild(h("div","amt",money(tot[c.id])));row.appendChild(h("span","chev","▶"));
    row.onclick=function(){open[c.id]=!open[c.id];render();};
    card.appendChild(row);
    var pr=h("div","prog"),pi=h("i");pi.style.width=(grand>0?tot[c.id]/grand*100:0)+"%";pi.style.background=c.color;pr.appendChild(pi);card.appendChild(pr);
    if(open[c.id]){
      var tx=h("div","tx");
      var list=S.tx.filter(function(t){return t.cat===c.id;}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
      if(!list.length)tx.appendChild(h("div","empty","No transactions yet"));
      list.forEach(function(t){
        var r=h("div","t"),d=h("div","d");
        d.appendChild(h("b","",t.note||"Expense"));d.appendChild(h("span","",fdate(t.date)));
        var x=h("button","x"+(armed===t.id?" armed":""),armed===t.id?"Delete?":"✕");
        x.style.width=armed===t.id?"auto":"";x.style.padding=armed===t.id?"0 12px":"";
        x.onclick=function(e){e.stopPropagation();if(armed===t.id){S.tx=S.tx.filter(function(z){return z.id!==t.id;});armed=null;save();render();toast("Deleted");}else{armed=t.id;render();}};
        r.appendChild(d);r.appendChild(h("div","a",money(t.amt)));r.appendChild(x);tx.appendChild(r);
      });
      var ed=h("button","link","✎ Edit category");ed.style.color="var(--acc)";ed.onclick=function(e){e.stopPropagation();openEdit(c);};tx.appendChild(ed);
      card.appendChild(tx);
    }
    box.appendChild(card);
  });
  if(!S.cats.length)box.appendChild(h("div","empty","Tap + to add your first expense and category."));
}

function openSheet(id){$("ov").classList.add("on");$(id).classList.add("on");}
function closeSheets(){$("ov").classList.remove("on");$("addSheet").classList.remove("on");$("dataSheet").classList.remove("on");$("editSheet").classList.remove("on");armed=null;}
$("ov").onclick=closeSheets;

function drawChips(){
  var box=$("fCats");box.textContent="";
  S.cats.forEach(function(c){
    var b=h("button","chip"+(selCat===c.id&&!newMode?" sel":""));
    var d=h("span","dot");d.style.background=c.color;b.appendChild(d);b.appendChild(document.createTextNode(c.name));
    b.onclick=function(){selCat=c.id;newMode=false;drawChips();};box.appendChild(b);
  });
  var n=h("button","chip"+(newMode?" sel":""),"＋ New category");
  n.onclick=function(){newMode=true;drawChips();setTimeout(function(){$("fNewCat").focus();},50);};
  box.appendChild(n);
  $("newCatBox").style.display=newMode?"block":"none";
}
$("fab").onclick=function(){
  $("fAmt").value="";$("fNote").value="";$("fNewCat").value="";$("fDate").value=today();
  newMode=!S.cats.length;if(!selCat||!S.cats.some(function(c){return c.id===selCat;}))selCat=S.cats.length?S.cats[0].id:null;
  drawChips();openSheet("addSheet");setTimeout(function(){$("fAmt").focus();},300);
};
$("saveBtn").onclick=function(){
  var amt=parseFloat(String($("fAmt").value).replace(/,/g,"."));
  if(!isFinite(amt)||amt<=0){toast("Enter an amount");return;}
  var cid=selCat;
  if(newMode){
    var name=$("fNewCat").value.trim();
    if(!name){toast("Name your new category");return;}
    var ex=S.cats.filter(function(c){return c.name.toLowerCase()===name.toLowerCase();})[0];
    if(ex)cid=ex.id;else{cid=uid();S.cats.push({id:cid,name:name,color:COLORS[S.cats.length%COLORS.length]});}
    selCat=cid;
  }
  if(!cid){toast("Choose a category");return;}
  S.tx.push({id:uid(),cat:cid,amt:Math.round(amt*100)/100,date:$("fDate").value||today(),note:$("fNote").value.trim()});
  open[cid]=true;save();render();closeSheets();toast("Expense added");
};

var editId=null,editColor=null,delArmed=false;
function drawSw(){
  var box=$("eSw");box.textContent="";
  var list=COLORS.indexOf(editColor)<0?COLORS.concat([editColor]):COLORS;
  list.forEach(function(col){var b=h("button","sw"+(col===editColor?" sel":""));b.style.background=col;b.setAttribute("aria-label","Color "+col);b.onclick=function(){editColor=col;drawSw();};box.appendChild(b);});
}
function openEdit(c){editId=c.id;editColor=c.color;delArmed=false;$("eName").value=c.name;$("eDel").textContent="Delete category";drawSw();updMove();openSheet("editSheet");}
function idx(){for(var i=0;i<S.cats.length;i++)if(S.cats[i].id===editId)return i;return -1;}
function updMove(){var i=idx();[["eUp",i<=0],["eDn",i<0||i>=S.cats.length-1]].forEach(function(p){var b=$(p[0]);b.disabled=p[1];b.style.opacity=p[1]?.4:1;});}
function mv(d){var i=idx(),j=i+d;if(i<0||j<0||j>=S.cats.length)return;var t=S.cats[i];S.cats[i]=S.cats[j];S.cats[j]=t;save();render();updMove();}
$("eUp").onclick=function(){mv(-1);};
$("eDn").onclick=function(){mv(1);};
$("eSave").onclick=function(){
  var name=$("eName").value.trim();
  if(!name){toast("Name can’t be empty");return;}
  var dup=S.cats.some(function(c){return c.id!==editId&&c.name.toLowerCase()===name.toLowerCase();});
  if(dup){toast("That category already exists");return;}
  S.cats.forEach(function(c){if(c.id===editId){c.name=name;c.color=editColor;}});
  save();render();closeSheets();toast("Category updated");
};
$("eDel").onclick=function(){
  var n=S.tx.filter(function(t){return t.cat===editId;}).length;
  if(!delArmed){delArmed=true;$("eDel").textContent=n?"Tap again to delete it and its "+n+" transaction"+(n===1?"":"s"):"Tap again to confirm delete";return;}
  S.cats=S.cats.filter(function(c){return c.id!==editId;});
  S.tx=S.tx.filter(function(t){return t.cat!==editId;});
  if(selCat===editId)selCat=null;
  save();render();closeSheets();toast("Category deleted");
};
$("menuBtn").onclick=function(){$("fCur").value=S.cur;$("storeNote").textContent=canStore?"":"Saving to this browser isn’t available here, so data lasts only until you close the page. Download a backup.";openSheet("dataSheet");};
$("fCur").oninput=function(){S.cur=$("fCur").value.trim();save();render();};

function stamp(){return new Date().toISOString().slice(0,10);}
function plainDl(name,data){
  try{
    var ext=name.split(".").pop(),type=ext==="csv"?"text/csv;charset=utf-8":"application/json";
    var u=URL.createObjectURL(new Blob([data],{type:type}));
    var a=document.createElement("a");a.href=u;a.download=name;a.style.display="none";
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},1500);
    toast("Downloading "+name);
  }catch(e){toast("Couldn’t save the file");}
}
function dl(name,data){
  if(!(window.claude&&claude.use)){plainDl(name,data);return;}
  if(!window.claude){toast("Downloads aren’t available here");return;}
  claude.use("downloads").then(function(d){
    if(!d){plainDl(name,data);return;}
    return d.save({filename:name,data:data}).then(function(){toast("Saved");}).catch(function(e){if(e&&e.code!=="declined")plainDl(name,data);});
  });
}
function q(s){s=String(s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
$("csvBtn").onclick=function(){
  var nm={};S.cats.forEach(function(c){nm[c.id]=c.name;});
  var rows=["Date,Category,Amount,Note"];
  S.tx.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(t){rows.push([t.date,q(nm[t.cat]||"Uncategorized"),t.amt.toFixed(2),q(t.note||"")].join(","));});
  rows.push("");rows.push("Category,Total");
  var g=0;S.cats.forEach(function(c){var s=0;S.tx.forEach(function(t){if(t.cat===c.id)s+=t.amt;});g+=s;rows.push(q(c.name)+","+s.toFixed(2));});
  rows.push("GRAND TOTAL,"+g.toFixed(2));
  dl("expenses-"+stamp()+".csv","\ufeff"+rows.join("\n"));
};
$("jsonBtn").onclick=function(){dl("expense-backup-"+stamp()+".json",JSON.stringify(S,null,2));};
$("impBtn").onclick=function(){$("impFile").click();};
$("impFile").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.cats)||!Array.isArray(d.tx))throw 0;S={cur:String(d.cur||"$"),cats:d.cats.map(function(c){return{id:String(c.id),name:String(c.name),color:String(c.color||COLORS[0])};}),tx:d.tx.map(function(t){return{id:String(t.id),cat:String(t.cat),amt:+t.amt||0,date:String(t.date),note:String(t.note||"")};})};save();render();closeSheets();toast("Backup restored");}catch(e){toast("That file isn’t a valid backup");}};
  r.readAsText(f);this.value="";
};
render();

})();
</script>
